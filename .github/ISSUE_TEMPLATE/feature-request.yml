name: Feature request
description: Propose a focused WindowsDeviceLink improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the operational problem first. Do not include secrets or identifying customer/device data.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow, risk or limitation should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result and user experience, not only an implementation.
    validations:
      required: true
  - type: dropdown
    id: lifecycle
    attributes:
      label: Lifecycle area
      options:
        - Identity and diagnostics
        - Pre-association or onboarding
        - Association completion
        - Tenant move or reconciliation
        - Offboarding or local reset
        - Authentication or security
        - GUI or operator experience
        - Function App API or deployment
        - Documentation or testing
        - Other
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Relevant mode
      options:
        - Local only
        - Direct
        - Backend
        - Multiple or not applicable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and use case
      description: Note Windows 11 or Windows PE, architecture, GUI/CLI/API and operator or automation use.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security and lifecycle considerations
      description: Could this affect tenant isolation, secrets, firmware state, deletion, moves or unattended execution?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: I removed secrets and identifying customer/device data.
          required: true

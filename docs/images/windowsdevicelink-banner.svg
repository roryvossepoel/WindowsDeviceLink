<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">WindowsDeviceLink — Device Association before OOBE and beyond</title>
  <desc id="desc">Prepare Device Association in Windows PE or Windows 11, use the operator GUI or PowerShell automation, and manage multitenant New, Move and Remove operations through the optional backend.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .brand { font-size: 28px; font-weight: 700; fill: #203e60; }
    .headline { font-size: 50px; font-weight: 700; fill: #172b42; }
    .headlineAccent { font-size: 44px; font-weight: 700; fill: #3976b9; }
    .body { font-size: 22px; fill: #425c75; }
    .label { font-size: 17px; font-weight: 600; fill: #172b42; }
    .small { font-size: 15px; fill: #425c75; }
    .icon { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
  </style>

  <rect x="1" y="1" width="1198" height="398" rx="20" fill="url(#background)" stroke="#cad6e3"/>
  <rect x="56" y="54" width="5" height="28" rx="2.5" fill="#3976b9"/>
  <text x="76" y="78" class="brand">WindowsDeviceLink</text>

  <text x="56" y="155" class="headline">Device Association.</text>
  <text x="56" y="215" class="headlineAccent">Before OOBE and beyond.</text>
  <text x="58" y="282" class="body">Prepare in Windows PE or Windows 11.</text>
  <text x="58" y="316" class="body">Onboard, move and offboard across Intune tenants.</text>

  <!-- Capability summary; the detailed lifecycle is shown separately in the README. -->
  <g transform="translate(724 66)">
    <rect width="420" height="268" rx="18" fill="#e5edf7"/>

    <rect x="20" y="20" width="180" height="132" rx="12" fill="#e7f2ff" stroke="#8ebce9"/>
    <g class="icon" stroke="#3976b9" transform="translate(82 35)">
      <rect x="0" y="0" width="56" height="42" rx="7"/>
      <path d="M18 50 H38 M28 42 V50"/>
      <path d="M17 21 L25 29 L40 14"/>
    </g>
    <text x="110" y="113" text-anchor="middle" class="label">Windows PE + 11</text>
    <text x="110" y="136" text-anchor="middle" class="small">Pre-association</text>

    <rect x="220" y="20" width="180" height="132" rx="12" fill="#eaf7f1" stroke="#8fc8b2"/>
    <g class="icon" stroke="#338567" transform="translate(282 35)">
      <rect x="0" y="0" width="56" height="42" rx="7"/>
      <path d="M0 13 H56"/>
      <path d="M10 7 H11 M18 7 H19"/>
      <path d="M13 23 L21 29 L13 35 M28 35 H42"/>
    </g>
    <text x="310" y="113" text-anchor="middle" class="label">GUI + PowerShell</text>
    <text x="310" y="136" text-anchor="middle" class="small">Operator or automation</text>

    <rect x="20" y="170" width="380" height="78" rx="12" fill="#f3edfa" stroke="#b69ad2"/>
    <g class="icon" stroke="#8b62b3" transform="translate(40 186)">
      <circle cx="27" cy="23" r="10"/>
      <circle cx="7" cy="7" r="5"/>
      <circle cx="47" cy="7" r="5"/>
      <path d="M11 10 L20 17 M43 10 L34 17"/>
      <path d="M27 33 V43"/>
    </g>
    <text x="104" y="202" class="label">Multitenant backend</text>
    <text x="104" y="226" class="small">Lookup · New · Move · Remove</text>
  </g>
</svg>

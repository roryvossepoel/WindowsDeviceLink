<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title description">
  <title id="title">WindowsDeviceLink device lifecycle</title>
  <desc id="description">A device is prepared, pre-associated through New, associated during deployment, and placed in service. From there it can be moved back to pre-association in another tenant or removed through offboarding and prepared for reuse.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172b4d" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#8198b0"/></marker>
    <marker id="arrowPurple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 Z" fill="#8b62b3"/></marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 Z" fill="#338567"/></marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #172b4d; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #536579; }
      .boxTitle { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #172b4d; }
      .boxText { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #536579; }
      .action { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: white; letter-spacing: .5px; }
      .loop { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #287457; }
    </style>
  </defs>
  <rect width="1440" height="560" rx="24" fill="url(#background)"/>
  <text x="720" y="58" text-anchor="middle" class="title">The complete device journey</text>
  <text x="720" y="89" text-anchor="middle" class="subtitle">Prepare before Windows installation, manage across tenants, and offboard safely for reuse</text>
  <path d="M300 300 H337" fill="none" stroke="#8198b0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M585 300 H622" fill="none" stroke="#8198b0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M870 300 H907" fill="none" stroke="#8198b0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1155 300 H1192" fill="none" stroke="#8198b0" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="60" y="210" width="240" height="168" rx="18" fill="#e7f2ff" stroke="#8ebce9"/>
    <rect x="345" y="210" width="240" height="168" rx="18" fill="white"/>
    <rect x="630" y="210" width="240" height="168" rx="18" fill="#eaf7f1" stroke="#8fc8b2"/>
    <rect x="915" y="210" width="240" height="168" rx="18" fill="#f3edfa" stroke="#b69ad2"/>
    <rect x="1200" y="210" width="180" height="168" rx="18" fill="#fff3e9" stroke="#e7ad7e"/>
  </g>
  <text x="180" y="258" text-anchor="middle" class="boxTitle">Prepare</text>
  <text x="180" y="287" text-anchor="middle" class="boxText">Windows PE or Windows 11</text><text x="180" y="314" text-anchor="middle" class="boxText">Create the local identity</text><text x="180" y="341" text-anchor="middle" class="boxText">before deployment</text>
  <text x="465" y="258" text-anchor="middle" class="boxTitle">Pre-associate</text>
  <text x="465" y="287" text-anchor="middle" class="boxText">Create the cloud record</text><text x="465" y="314" text-anchor="middle" class="boxText">in the target tenant</text><text x="465" y="341" text-anchor="middle" class="boxText">before OOBE</text>
  <text x="750" y="258" text-anchor="middle" class="boxTitle">Deploy + associate</text>
  <text x="750" y="287" text-anchor="middle" class="boxText">Windows installation and OOBE</text><text x="750" y="314" text-anchor="middle" class="boxText">complete the local binding</text><text x="750" y="341" text-anchor="middle" class="boxText">on supported Windows 11</text>
  <text x="1035" y="258" text-anchor="middle" class="boxTitle">In service</text>
  <text x="1035" y="287" text-anchor="middle" class="boxText">Inspect local and cloud state</text><text x="1035" y="314" text-anchor="middle" class="boxText">in the current tenant</text><text x="1035" y="341" text-anchor="middle" class="boxText">until move or offboarding</text>
  <text x="1290" y="258" text-anchor="middle" class="boxTitle">Offboard</text>
  <text x="1290" y="287" text-anchor="middle" class="boxText">Remove cloud state</text><text x="1290" y="314" text-anchor="middle" class="boxText">and clear local binding</text><text x="1290" y="341" text-anchor="middle" class="boxText">when required</text>
  <rect x="307" y="166" width="70" height="30" rx="15" fill="#3976b9"/><text x="342" y="187" text-anchor="middle" class="action">NEW</text>
  <rect x="1159" y="166" width="84" height="30" rx="15" fill="#d47a3d"/><text x="1201" y="187" text-anchor="middle" class="action">REMOVE</text>
  <path d="M1035 210 C1035 126 465 126 465 202" fill="none" stroke="#8b62b3" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <rect x="712" y="112" width="76" height="30" rx="15" fill="#8b62b3"/><text x="750" y="133" text-anchor="middle" class="action">MOVE</text>
  <path d="M1290 400 C1290 515 180 515 180 400" fill="none" stroke="#338567" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="505" y="438" width="460" height="30" rx="15" fill="#eef4fb"/>
  <text x="735" y="459" text-anchor="middle" class="loop">Reset, reassign and reuse the same physical device</text>
</svg>

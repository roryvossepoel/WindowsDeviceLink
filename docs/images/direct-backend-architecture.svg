<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
  <title id="title">WindowsDeviceLink Direct and Backend modes</title>
  <desc id="description">WindowsDeviceLink includes an operator GUI and PowerShell commands. Both can use Direct mode with explicit tenant sign-in or Backend mode through a Function App, one Entra app registration, cross-tenant lookup and reconciliation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172b4d" flood-opacity="0.13"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#3976b9"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#7b55a4"/></marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #172b4d; }.subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #536579; }
      .section { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #172b4d; }.boxTitle { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #172b4d; }.boxText { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #536579; }.small { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #536579; }
      .whiteTitle { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: white; }.whiteText { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #eaf3ff; }.action { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: white; letter-spacing: .4px; }
    </style>
  </defs>
  <rect width="1440" height="820" rx="24" fill="url(#background)"/>
  <text x="720" y="52" text-anchor="middle" class="title">One product, two tenant-access modes</text><text x="720" y="83" text-anchor="middle" class="subtitle">GUI and PowerShell share the same WindowsDeviceLink lifecycle and safety controls</text>
  <g filter="url(#shadow)"><rect x="400" y="112" width="640" height="162" rx="20" fill="#233b5f"/></g>
  <text x="720" y="151" text-anchor="middle" class="whiteTitle">WindowsDeviceLink</text><text x="720" y="177" text-anchor="middle" class="whiteText">The product and validated lifecycle engine</text>
  <rect x="455" y="202" width="250" height="48" rx="13" fill="#36577f" stroke="#769bc7"/><rect x="735" y="202" width="250" height="48" rx="13" fill="#36577f" stroke="#769bc7"/>
  <text x="580" y="232" text-anchor="middle" class="whiteTitle" style="font-size:17px">Operator GUI</text><text x="860" y="232" text-anchor="middle" class="whiteTitle" style="font-size:17px">PowerShell commands</text>
  <path d="M720 274 V314" fill="none" stroke="#233b5f" stroke-width="3"/><circle cx="720" cy="314" r="5" fill="#233b5f"/><path d="M720 314 H355 V347" fill="none" stroke="#3976b9" stroke-width="3" marker-end="url(#arrowBlue)"/><path d="M720 314 H1085 V347" fill="none" stroke="#7b55a4" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <g filter="url(#shadow)"><rect x="60" y="350" width="590" height="390" rx="20" fill="white" stroke="#8ebce9"/><rect x="790" y="350" width="590" height="390" rx="20" fill="white" stroke="#b69ad2"/></g>
  <text x="355" y="391" text-anchor="middle" class="section">Direct mode</text><text x="355" y="418" text-anchor="middle" class="boxText">Multiple tenants through explicit operator context</text>
  <rect x="105" y="452" width="500" height="72" rx="15" fill="#e7f2ff"/><text x="355" y="480" text-anchor="middle" class="boxTitle">Select a target tenant</text><text x="355" y="505" text-anchor="middle" class="boxText">Interactive or DeviceCode sign-in</text>
  <path d="M355 524 V554" fill="none" stroke="#3976b9" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="105" y="558" width="500" height="72" rx="15" fill="#eef5fc"/><text x="355" y="586" text-anchor="middle" class="boxTitle">Operate in the selected tenant</text><text x="355" y="611" text-anchor="middle" class="boxText">Lookup • New • Remove</text>
  <path d="M355 630 V660" fill="none" stroke="#3976b9" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="105" y="664" width="500" height="48" rx="15" fill="#f7faff" stroke="#c8d7e7"/><text x="355" y="694" text-anchor="middle" class="boxText">Sign out and sign in again to switch tenants</text>
  <text x="1085" y="391" text-anchor="middle" class="section">Backend mode — recommended</text><text x="1085" y="418" text-anchor="middle" class="boxText">Central lookup, reconciliation and unattended operation</text>
  <rect x="835" y="448" width="500" height="58" rx="15" fill="#f3edfa"/><text x="1085" y="483" text-anchor="middle" class="boxTitle">Function App API</text>
  <path d="M1085 506 V529" fill="none" stroke="#7b55a4" stroke-width="3" marker-end="url(#arrowPurple)"/><rect x="835" y="533" width="500" height="67" rx="15" fill="#f7f3fb"/><text x="1085" y="560" text-anchor="middle" class="boxTitle">One Entra app registration</text><text x="1085" y="584" text-anchor="middle" class="boxText">Consent in one or multiple configured tenants</text>
  <path d="M1085 600 V623" fill="none" stroke="#7b55a4" stroke-width="3" marker-end="url(#arrowPurple)"/><rect x="835" y="627" width="500" height="72" rx="15" fill="#ede5f6"/><text x="1085" y="655" text-anchor="middle" class="boxTitle">Lookup + reconcile</text><text x="1085" y="680" text-anchor="middle" class="boxText">Determine the action and tenant automatically</text>
  <rect x="840" y="713" width="68" height="27" rx="13.5" fill="#3976b9"/><rect x="916" y="713" width="76" height="27" rx="13.5" fill="#6d879f"/><rect x="1000" y="713" width="68" height="27" rx="13.5" fill="#8b62b3"/><rect x="1076" y="713" width="76" height="27" rx="13.5" fill="#9b72bf"/><rect x="1160" y="713" width="88" height="27" rx="13.5" fill="#d47a3d"/><rect x="1256" y="713" width="70" height="27" rx="13.5" fill="#338567"/>
  <text x="874" y="732" text-anchor="middle" class="action">NEW</text><text x="954" y="732" text-anchor="middle" class="action">NO-OP</text><text x="1034" y="732" text-anchor="middle" class="action">MOVE</text><text x="1114" y="732" text-anchor="middle" class="action">REPAIR</text><text x="1204" y="732" text-anchor="middle" class="action">REMOVE</text><text x="1291" y="732" text-anchor="middle" class="action">VERIFY</text>
  <text x="720" y="786" text-anchor="middle" class="small">Deployment automation and OEM or reseller preparation use the WindowsDeviceLink PowerShell interface, normally with Backend mode.</text>
</svg>
